services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pass123
      POSTGRES_DB: ragen-token-vault
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - ragen_vault_pgdata:/var/lib/postgresql/data

volumes:
  ragen_vault_pgdata:
